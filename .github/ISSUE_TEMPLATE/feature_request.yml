name: Feature request
description: Suggest an improvement or a new feature.
labels: [ enhancement ]
body:
  - type: input
    id: package
    attributes:
      label: Package
      placeholder: Curiosus.Utils / Curiosus.Tools
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing or inconvenient now?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could the API or behavior look? A code sample helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
